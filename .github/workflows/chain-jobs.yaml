name: chaining jobs

on:
  workflow_dispatch:
    inputs:
      run-job-3:
        description: "run job 3"
        required: true
        type: boolean

jobs:
  job-1:
    name: job 1
    runs-on: ubuntu-latest
    steps:
      - name: output for job 1
        run: echo "hellog from job 1 ${{github.event.inputs.run-job-3}}"
  job-2:
    name: job 2
    runs-on: ubuntu-latest
    needs: job-1
    steps:
      - name: output for job 2
        run: echo "hello from job 2"

  job-3:
    name: job 3
    if: github.event.inputs.run-job-3 == 'true'
    needs: job-1
    runs-on: ubuntu-latest
    steps:
      - name: output for job 3
        run: echo "hello from job 3"
