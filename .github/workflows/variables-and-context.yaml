name: variable and context

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'presion to greet'
        default: 'word'
        required: true

jobs:
  job-1:
    runs-on: ubuntu-latest
    steps:
      - name: dumb context object
        env:
          GITHUB_CONTEXT_OBJECT: ${{ toJSON(github) }}
        run: echo "$GITHUB_CONTEXT_OBJECT"
  job-2:
    runs-on: ubuntu-latest
    outputs:
      output1: ${{ steps.step1.outputs.step1value }}
      output2: ${{ steps.step2.outputs.step2value }}
    steps:
      - name: step 1
        id: step1
        run: echo "step1value=fromstep1" >> $GITHUB_OUTPUT

      - name: step 2
        id: step2
        run: echo "step2value=fromstep2" >> $GITHUB_OUTPUT

  job-3:
    runs-on: ubuntu-latest
    needs: job-2
    steps:
      - name: step 1
        run: echo "job 2 output: ${{ needs['job-2].outputs.output2 }}"
